<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrarium Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            overscroll-behavior-y: none; /* Prevents mobile pull-to-refresh */
        }

        #terrarium-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none; /* Prevents mobile swipe scrolling */
        }

        .ui-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            max-width: 340px;
            background-color: #1E1E1E;
            border: 1px solid #333333;
            padding: 24px;
            pointer-events: auto;
            border-radius: 6px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #A0A0A0;
            margin-bottom: 20px;
        }

        .data-section {
            background-color: #262626;
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 6px;
        }
        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            color: #888888;
        }
        
        .data-value {
            color: #FFFFFF;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #FFFFFF;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333333;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #FF6B00;
            border-radius: 50%;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: #2A2A2A;
            color: #E0E0E0;
            border: 1px solid #404040;
            padding: 12px 10px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            background-color: #404040;
        }

        @media (hover: hover) {
            button:hover {
                background-color: #333333;
                border-color: #666666;
                color: #FFFFFF;
            }
            button.primary-action:hover {
                background-color: #FF8533;
            }
        }

        button.primary-action {
            grid-column: span 2;
            background-color: #FF6B00;
            color: #000000;
            font-weight: 600;
            border: none;
            margin-top: 6px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .ui-panel { 
                top: 16px; 
                left: 16px; 
                width: calc(100% - 32px); 
                padding: 16px; 
            }
            h1 { font-size: 1.15rem; }
            .subtitle { font-size: 0.8rem; margin-bottom: 16px; }
            .data-section { margin-bottom: 16px; }
            .status-indicator { margin-bottom: 16px; padding-bottom: 16px; }
            button { font-size: 0.8rem; padding: 10px 6px; }
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h1>Terrarium Simulator</h1>
        <div class="subtitle">Procedural generation based on live local weather.</div>
        
        <div class="data-section">
            <div class="data-row">
                <span class="data-label">Coordinates</span>
                <span class="data-value" id="val-loc">Fetching...</span>
            </div>
            <div class="data-row">
                <span class="data-label">Temperature</span>
                <span class="data-value" id="val-temp">--°C</span>
            </div>
            <div class="data-row">
                <span class="data-label">Humidity</span>
                <span class="data-value" id="val-hum">--%</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value" id="val-wind">-- m/s</span>
            </div>
        </div>

        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="status-label">Awaiting GPS Permission</span>
        </div>

        <div class="controls-grid">
            <button onclick="terrarium.addSandLayer()">Add Sand</button>
            <button onclick="terrarium.toggleWater()">Add Water</button>
            <button onclick="terrarium.spawnEgg()">Add Egg</button>
            <button onclick="terrarium.spawnOrganism()">Add Bug</button>
            <button class="primary-action" onclick="terrarium.triggerMutation()">Regenerate Flora</button>
        </div>
    </div>

    <canvas id="terrarium-canvas"></canvas>

    <script>
        class DigitalTerrarium {
            constructor() {
                this.canvas = document.getElementById('terrarium-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 100));

                this.env = {
                    temperature: 20,
                    humidity: 50,
                    isNight: false,
                    wind: 0.1,
                    locationName: "Local"
                };

                this.plants = [];
                this.particles = [];
                this.fish = [];
                this.eggs = [];
                this.organisms = [];
                this.hasSand = false;
                this.hasWater = false;
                this.time = 0;

                this.initGPSAndWeather();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width * window.devicePixelRatio;
                this.canvas.height = this.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            async initGPSAndWeather() {
                const statusLabel = document.getElementById('status-label');

                if (!navigator.geolocation) {
                    this.fallbackWeather(statusLabel);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        try {
                            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,is_day,wind_speed_10m`);
                            const data = await res.json();
                            
                            this.env.temperature = data.current.temperature_2m;
                            this.env.humidity = data.current.relative_humidity_2m;
                            this.env.isNight = data.current.is_day === 0;
                            this.env.wind = Math.max(0.1, data.current.wind_speed_10m / 10);
                            
                            const latStr = latitude > 0 ? `${latitude.toFixed(2)}N` : `${Math.abs(latitude).toFixed(2)}S`;
                            const lonStr = longitude > 0 ? `${longitude.toFixed(2)}E` : `${Math.abs(longitude).toFixed(2)}W`;
                            
                            document.getElementById('val-loc').innerText = `${latStr}, ${lonStr}`;
                            document.getElementById('val-temp').innerText = `${this.env.temperature}°C`;
                            document.getElementById('val-hum').innerText = `${this.env.humidity}%`;
                            document.getElementById('val-wind').innerText = `${this.env.wind.toFixed(1)} m/s`;
                            
                            statusLabel.innerText = this.env.isNight ? "Night cycle active" : "Day cycle active";
                            
                            this.buildEcosystem();
                        } catch (e) {
                            this.fallbackWeather(statusLabel);
                        }
                    },
                    () => {
                        this.fallbackWeather(statusLabel);
                    }
                );
            }

            fallbackWeather(statusLabel) {
                this.env.temperature = 22;
                this.env.humidity = 45;
                this.env.isNight = false;
                this.env.wind = 0.2;
                
                document.getElementById('val-loc').innerText = `Default`;
                document.getElementById('val-temp').innerText = `22°C`;
                document.getElementById('val-hum').innerText = `45%`;
                document.getElementById('val-wind').innerText = `0.2 m/s`;
                
                statusLabel.innerText = "Running default simulation";
                this.buildEcosystem();
            }

            buildEcosystem() {
                this.plants = [];
                // Adapts plant count automatically based on screen width (Mobile vs PC)
                const plantCount = Math.max(4, Math.floor(this.width / 150));
                for (let i = 0; i < plantCount; i++) {
                    const x = (this.width / (plantCount + 1)) * (i + 1) + (Math.random() * 40 - 20);
                    this.plants.push(new ProceduralPlant(x, this.height * 0.85, this.env));
                }
                for (let i = 0; i < 2; i++) {
                    this.organisms.push(new CrawlingOrganism(Math.random() * this.width, this.height * 0.85));
                }
            }

            addSandLayer() {
                this.hasSand = true;
                document.getElementById('status-label').innerText = "Sand layer added";
            }

            toggleWater() {
                this.hasWater = !this.hasWater;
                document.getElementById('status-label').innerText = this.hasWater ? "Water layer added" : "Water removed";
                if (this.hasWater && this.fish.length === 0) {
                    for(let i = 0; i < 2; i++) {
                        this.fish.push(new Fish(Math.random() * this.width, this.height * 0.6));
                    }
                }
            }

            spawnEgg() {
                this.eggs.push(new FishEgg(Math.random() * (this.width - 100) + 50, this.height * 0.82));
                document.getElementById('status-label').innerText = "Egg added";
            }

            spawnOrganism() {
                this.organisms.push(new CrawlingOrganism(Math.random() * this.width, this.height * 0.85));
                document.getElementById('status-label').innerText = "Bug added";
            }

            triggerMutation() {
                this.plants.forEach(plant => plant.mutate(this.env));
                document.getElementById('status-label').innerText = "Flora regenerated";
            }

            update() {
                this.time += 0.016;
                this.plants.forEach(p => p.update(this.env, this.time));
                this.organisms.forEach(o => o.update(this.width));
                this.fish.forEach(f => f.update(this.width, this.height, this.hasWater));

                for (let i = this.eggs.length - 1; i >= 0; i--) {
                    let egg = this.eggs[i];
                    egg.update();
                    if (egg.hatched) {
                        this.fish.push(new Fish(egg.x, egg.y));
                        this.eggs.splice(i, 1);
                        document.getElementById('status-label').innerText = "Egg hatched";
                    }
                }

                if (Math.random() < 0.3) {
                    const randomPlant = this.plants[Math.floor(Math.random() * this.plants.length)];
                    if (randomPlant) {
                        this.particles.push(new AmbientParticle(randomPlant.tipX, randomPlant.tipY, this.env, this.hasWater));
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.update(this.env, this.hasWater);
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw() {
                this.ctx.fillStyle = this.env.isNight ? '#0a0a0a' : '#1a242f';
                this.ctx.fillRect(0, 0, this.width, this.height);

                const floorY = this.height * 0.85;

                if (this.hasSand) {
                    this.ctx.fillStyle = '#C2A379';
                    this.ctx.fillRect(0, floorY, this.width, this.height - floorY);
                } else {
                    this.ctx.fillStyle = '#111111';
                    this.ctx.fillRect(0, floorY, this.width, this.height - floorY);
                    this.ctx.strokeStyle = '#333333';
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, floorY);
                    this.ctx.lineTo(this.width, floorY);
                    this.ctx.stroke();
                }

                if (this.hasWater) {
                    this.ctx.fillStyle = 'rgba(74, 144, 226, 0.2)';
                    this.ctx.fillRect(0, this.height * 0.4, this.width, floorY - (this.height * 0.4));
                    this.ctx.strokeStyle = 'rgba(74, 144, 226, 0.4)';
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, this.height * 0.4);
                    this.ctx.lineTo(this.width, this.height * 0.4);
                    this.ctx.stroke();
                }

                this.plants.forEach(p => p.draw(this.ctx));
                this.eggs.forEach(e => e.draw(this.ctx));
                this.organisms.forEach(o => o.draw(this.ctx));
                this.fish.forEach(f => f.draw(this.ctx));
                this.particles.forEach(p => p.draw(this.ctx));
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        class ProceduralPlant {
            constructor(x, y, env) {
                this.x = x;
                this.y = y;
                this.env = env;
                this.mutate(env);
            }

            mutate(env) {
                this.segments = Math.floor(4 + Math.random() * 3);
                this.baseLength = 30 + (env.humidity * 0.3) + Math.random() * 20;
                this.angleVar = (Math.random() - 0.5) * 0.3;
                this.thickness = 3 + Math.random() * 2;
                this.nodeSwayOffset = Math.random() * 100;
                this.tipX = this.x;
                this.tipY = this.y - (this.segments * this.baseLength);
            }

            update(env, time) {
                this.sway = Math.sin(time * 1.5 + this.nodeSwayOffset) * (env.wind * 0.8);
            }

            draw(ctx) {
                ctx.save();
                ctx.strokeStyle = '#4A7C59';
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'square'; 
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);

                let currX = this.x;
                let currY = this.y;

                for (let i = 0; i < this.segments; i++) {
                    const segmentFactor = (i + 1) / this.segments;
                    currX += Math.sin(this.angleVar * i + this.sway) * (this.baseLength * 0.4);
                    currY -= this.baseLength * (1 - segmentFactor * 0.1);
                    
                    if (i === this.segments - 1) {
                        this.tipX = currX;
                        this.tipY = currY;
                    }
                    ctx.lineTo(currX, currY);
                }
                ctx.stroke();

                ctx.fillStyle = '#FF6B00';
                ctx.beginPath();
                ctx.arc(this.tipX, this.tipY, this.thickness + 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FishEgg {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.hatchTimer = 0;
                this.hatchTimeMax = 200 + Math.random() * 100;
                this.hatched = false;
            }

            update() {
                this.hatchTimer++;
                if (this.hatchTimer >= this.hatchTimeMax) {
                    this.hatched = true;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = '#E0E0E0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Fish {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = 10 + Math.random() * 6;
                this.tailWiggle = 0;
            }

            update(width, height, hasWater) {
                this.tailWiggle += 0.3;
                this.x += this.vx;
                this.y += this.vy + Math.sin(this.tailWiggle * 0.5) * 0.2;

                if (this.x < 20 || this.x > width - 20) this.vx *= -1;
                if (this.y < height * 0.45 || this.y > height * 0.8) this.vy *= -1;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.vx < 0) ctx.scale(-1, 1);

                ctx.fillStyle = '#FF6B00'; 
                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size, -this.size/2);
                ctx.lineTo(-this.size, this.size/2);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                const tailOffset = Math.sin(this.tailWiggle) * 4;
                ctx.moveTo(-this.size, 0);
                ctx.lineTo(-this.size - 6, -4 + tailOffset);
                ctx.lineTo(-this.size - 6, 4 + tailOffset);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class CrawlingOrganism {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.size = 3;
            }

            update(width) {
                this.x += this.vx;
                if (this.x < 10 || this.x > width - 10) this.vx *= -1;
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = '#888888';
                ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size);
                ctx.restore();
            }
        }

        class AmbientParticle {
            constructor(x, y, env, hasWater) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5 + (env.wind * 0.5);
                this.vy = hasWater ? -Math.random() * 1.2 - 0.2 : -Math.random() * 0.8 - 0.2;
                this.alpha = 1.0;
                this.size = 2;
            }

            update(env, hasWater) {
                this.x += this.vx + (env.wind * 0.2);
                this.y += this.vy;
                this.alpha -= 0.01;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#A0A0A0';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        const terrarium = new DigitalTerrarium();
        terrarium.loop();
    </script>
</body>
</html>
