<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrarium Simulator Sandbox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            overscroll-behavior-y: none;
        }

        #terrarium-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: crosshair;
        }

        .ui-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            max-width: 340px;
            background-color: #1E1E1E;
            border: 1px solid #333333;
            padding: 20px;
            pointer-events: auto;
            border-radius: 6px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #A0A0A0;
            margin-bottom: 16px;
        }

        .data-section {
            background-color: #262626;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 4px;
        }
        .data-row:last-child { margin-bottom: 0; }
        .data-label { color: #888888; }
        .data-value {
            color: #FFFFFF;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
        }

        .section-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #777777;
            margin-bottom: 6px;
            margin-top: 14px;
            font-weight: 600;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background-color: #2A2A2A;
            color: #E0E0E0;
            border: 1px solid #404040;
            padding: 9px 6px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            text-align: center;
        }

        button:active { background-color: #404040; }

        @media (hover: hover) {
            button:hover {
                background-color: #333333;
                border-color: #666666;
                color: #FFFFFF;
            }
        }

        button.active-tool {
            background-color: #FF6B00;
            color: #000;
            border-color: #FF6B00;
            font-weight: 600;
        }

        button.speed-btn {
            background-color: #1A3A5A;
            border-color: #2A5A8A;
            color: #88C0D0;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .ui-panel { top: 12px; left: 12px; width: calc(100% - 24px); padding: 14px; }
            h1 { font-size: 1.05rem; }
            .subtitle { font-size: 0.75rem; margin-bottom: 12px; }
            button { font-size: 0.75rem; padding: 8px 4px; }
        }
    </style>
</head>
<body>

    <div class="ui-panel" id="ui-panel">
        <h1>Terrarium Sandbox</h1>
        <div class="subtitle">Physics, sensory fidget, and live climate.</div>
        
        <div class="data-section">
            <div class="data-row">
                <span class="data-label">Climate</span>
                <span class="data-value" id="val-climate">--°C / --%</span>
            </div>
            <div class="data-row">
                <span class="data-label">Cycle</span>
                <span class="data-value" id="val-time">--</span>
            </div>
        </div>

        <div class="section-label">Interactive & Sensory Tools</div>
        <div class="controls-grid">
            <button class="tool-btn active-tool" onclick="terrarium.setTool('interact')" id="tool-interact">✨ Touch / Pop</button>
            <button class="tool-btn" onclick="terrarium.setTool('magnet')" id="tool-magnet">🧲 Magnet</button>
            <button class="tool-btn" onclick="terrarium.setTool('rain')" id="tool-rain">🌧️ Rain</button>
            <button class="tool-btn" onclick="terrarium.setTool('sand')" id="tool-sand">⏳ Pour Sand</button>
            <button class="tool-btn" onclick="terrarium.setTool('water')" id="tool-water">💧 Pour Water</button>
            <button class="tool-btn" onclick="terrarium.setTool('food')" id="tool-food">🍞 Drop Food</button>
            <button class="tool-btn" onclick="terrarium.setTool('seed')" id="tool-seed" style="grid-column: span 2;">🌱 Plant Seed</button>
        </div>

        <div class="section-label">Ecosystem Actions</div>
        <div class="controls-grid">
            <button onclick="terrarium.spawnOrganism()">🐛 Add Bug</button>
            <button onclick="terrarium.spawnEgg()">🥚 Add Egg</button>
            <button onclick="terrarium.toggleNight()" id="btn-night">🌙 Toggle Night</button>
            <button class="speed-btn" onclick="terrarium.toggleSpeed()" id="btn-speed">⏩ Speed: 1x</button>
            <button onclick="terrarium.clearCanvas()" style="grid-column: span 2;">🔄 Clear Sandbox</button>
        </div>
    </div>

    <canvas id="terrarium-canvas"></canvas>

    <script>
        class DigitalTerrarium {
            constructor() {
                this.canvas = document.getElementById('terrarium-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 100));

                this.env = { temperature: 20, humidity: 50, isNight: false, wind: 0.1 };
                this.forceNight = false;

                // Entities
                this.plants = [];
                this.particles = [];
                this.fish = [];
                this.eggs = [];
                this.organisms = [];
                this.drops = []; 
                this.foods = [];
                this.raindrops = [];
                this.ripples = [];
                
                // Physics Bounds
                this.sandLevel = 20; 
                this.waterLevel = 0;
                this.floorY = this.height * 0.9;
                
                // Simulation State
                this.time = 0;
                this.timeScale = 1;
                this.activeTool = 'interact';
                this.isPointerDown = false;
                this.pointerX = 0;
                this.pointerY = 0;

                this.setupInputs();
                this.initGPSAndWeather();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width * window.devicePixelRatio;
                this.canvas.height = this.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.floorY = this.height * 0.9;
            }

            setupInputs() {
                const updatePointer = (e) => {
                    this.pointerX = e.clientX || (e.touches && e.touches[0].clientX);
                    this.pointerY = e.clientY || (e.touches && e.touches[0].clientY);
                };

                this.canvas.addEventListener('pointerdown', (e) => {
                    if (e.target !== this.canvas) return;
                    this.isPointerDown = true;
                    updatePointer(e);
                    
                    if (this.activeTool === 'seed') {
                        this.plants.push(new ProceduralPlant(this.pointerX, this.floorY, this.env));
                    } else if (this.activeTool === 'interact') {
                        this.ripples.push(new SensoryRipple(this.pointerX, this.pointerY));
                    }
                });

                this.canvas.addEventListener('pointermove', (e) => {
                    if (!this.isPointerDown) return;
                    updatePointer(e);
                    if (this.activeTool === 'interact' && Math.random() < 0.25) {
                        this.ripples.push(new SensoryRipple(this.pointerX, this.pointerY));
                    }
                });

                window.addEventListener('pointerup', () => this.isPointerDown = false);
            }

            setTool(toolName) {
                this.activeTool = toolName;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active-tool'));
                document.getElementById(`tool-${toolName}`).classList.add('active-tool');
            }

            toggleSpeed() {
                if (this.timeScale === 1) this.timeScale = 3;
                else if (this.timeScale === 3) this.timeScale = 10;
                else this.timeScale = 1;
                document.getElementById('btn-speed').innerText = `⏩ Speed: ${this.timeScale}x`;
            }

            toggleNight() {
                this.forceNight = !this.forceNight;
                const isNightActive = this.forceNight || this.env.isNight;
                document.getElementById('val-time').innerText = isNightActive ? "Night (Active)" : "Day (Active)";
                document.getElementById('btn-night').innerText = this.forceNight ? "☀️ Reset Cycle" : "🌙 Force Night";
            }

            clearCanvas() {
                this.plants = [];
                this.fish = [];
                this.eggs = [];
                this.organisms = [];
                this.sandLevel = 20;
                this.waterLevel = 0;
                this.drops = [];
                this.foods = [];
                this.raindrops = [];
                this.ripples = [];
            }

            async initGPSAndWeather() {
                if (!navigator.geolocation) {
                    this.fallbackWeather();
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        try {
                            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,is_day,wind_speed_10m`);
                            const data = await res.json();
                            this.env.temperature = data.current.temperature_2m;
                            this.env.humidity = data.current.relative_humidity_2m;
                            this.env.isNight = data.current.is_day === 0;
                            this.env.wind = Math.max(0.1, data.current.wind_speed_10m / 10);
                            
                            document.getElementById('val-climate').innerText = `${this.env.temperature}°C / ${this.env.humidity}%`;
                            document.getElementById('val-time').innerText = (this.forceNight || this.env.isNight) ? "Night" : "Day";
                            this.buildEcosystem();
                        } catch (e) { this.fallbackWeather(); }
                    },
                    () => { this.fallbackWeather(); }
                );
            }

            fallbackWeather() {
                this.env = { temperature: 22, humidity: 45, isNight: false, wind: 0.2 };
                document.getElementById('val-climate').innerText = `22°C / 45% (Def)`;
                document.getElementById('val-time').innerText = "Day (Def)";
                this.buildEcosystem();
            }

            buildEcosystem() {
                this.clearCanvas();
                const plantCount = Math.max(3, Math.floor(this.width / 200));
                for (let i = 0; i < plantCount; i++) {
                    const x = (this.width / (plantCount + 1)) * (i + 1) + (Math.random() * 40 - 20);
                    this.plants.push(new ProceduralPlant(x, this.floorY, this.env));
                }
                for (let i = 0; i < 2; i++) this.spawnOrganism();
            }

            spawnEgg() {
                this.eggs.push(new FishEgg(Math.random() * (this.width - 100) + 50, this.height * 0.2));
            }

            spawnOrganism() {
                this.organisms.push(new CrawlingOrganism(Math.random() * this.width));
            }

            handleTools(dt) {
                if (this.isPointerDown) {
                    if (this.activeTool === 'sand' || this.activeTool === 'water') {
                        const dropsToSpawn = Math.max(1, Math.floor(3 * dt));
                        for (let i = 0; i < dropsToSpawn; i++) {
                            this.drops.push(new Drop(this.pointerX, this.pointerY, this.activeTool));
                        }
                    } else if (this.activeTool === 'food') {
                        if (Math.random() < 0.15 * dt && this.foods.length < 50) {
                            this.foods.push(new Food(this.pointerX, this.pointerY));
                        }
                    } else if (this.activeTool === 'rain') {
                        const rainCount = Math.max(2, Math.floor(4 * dt));
                        for (let i = 0; i < rainCount; i++) {
                            this.raindrops.push(new RainDrop(Math.random() * this.width, 0, this.env.wind));
                        }
                    }
                }
            }

            update() {
                const dt = this.timeScale;
                this.time += 0.016 * dt;
                
                this.handleTools(dt);

                const sandTop = this.floorY - this.sandLevel;
                const waterTop = sandTop - this.waterLevel;
                const hasWater = this.waterLevel > 30;
                const isMagnetActive = this.isPointerDown && this.activeTool === 'magnet';

                // Sand & Water Drops
                for (let i = this.drops.length - 1; i >= 0; i--) {
                    let drop = this.drops[i];
                    drop.update(dt);
                    if (drop.type === 'sand' && drop.y >= sandTop) {
                        if (this.sandLevel < this.height * 0.5) this.sandLevel += 0.05;
                        this.drops.splice(i, 1);
                    } else if (drop.type === 'water' && drop.y >= waterTop) {
                        if (this.waterLevel < this.height * 0.6) this.waterLevel += 0.05;
                        this.drops.splice(i, 1);
                    } else if (drop.y > this.height + 50) {
                        this.drops.splice(i, 1);
                    }
                }

                // Raindrops
                for (let i = this.raindrops.length - 1; i >= 0; i--) {
                    let r = this.raindrops[i];
                    r.update(dt);
                    if (r.y >= waterTop) {
                        if (this.waterLevel < this.height * 0.6) this.waterLevel += 0.02;
                        if (Math.random() < 0.1) this.ripples.push(new SensoryRipple(r.x, waterTop, '#4A90E2', 0.8));
                        this.raindrops.splice(i, 1);
                    } else if (r.y >= sandTop) {
                        this.raindrops.splice(i, 1);
                    }
                }

                // Sensory Ripples
                for (let i = this.ripples.length - 1; i >= 0; i--) {
                    let rip = this.ripples[i];
                    rip.update(dt);
                    if (!rip.active) this.ripples.splice(i, 1);
                }

                // Food Pellets
                for (let i = this.foods.length - 1; i >= 0; i--) {
                    let food = this.foods[i];
                    if (isMagnetActive) {
                        food.applyMagnet(this.pointerX, this.pointerY, dt);
                    }
                    food.update(sandTop, waterTop, hasWater, dt);
                    if (!food.active) this.foods.splice(i, 1);
                }

                // Tactile Flora
                this.plants.forEach(p => p.update(this.env, this.time, this.isPointerDown, this.pointerX, this.pointerY, dt));
                
                // Organisms
                this.organisms.forEach(o => {
                    if (isMagnetActive) o.applyMagnet(this.pointerX, this.pointerY, dt);
                    o.update(this.width, sandTop, this.foods, dt);
                });

                // Fish
                this.fish.forEach(f => {
                    if (isMagnetActive) f.applyMagnet(this.pointerX, this.pointerY, dt);
                    f.update(this.width, sandTop, waterTop, hasWater, this.foods, dt);
                });

                // Eggs
                for (let i = this.eggs.length - 1; i >= 0; i--) {
                    let egg = this.eggs[i];
                    egg.update(sandTop, dt);
                    if (egg.hatched) {
                        this.fish.push(new Fish(egg.x, egg.y));
                        this.eggs.splice(i, 1);
                    }
                }

                // Ambient Particles
                if (Math.random() < 0.1 * dt) {
                    const rp = this.plants[Math.floor(Math.random() * this.plants.length)];
                    if (rp) this.particles.push(new AmbientParticle(rp.tipX, rp.tipY, this.env, hasWater));
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    if (isMagnetActive) p.applyMagnet(this.pointerX, this.pointerY, dt);
                    p.update(this.env, hasWater, dt);
                    if (p.alpha <= 0) this.particles.splice(i, 1);
                }
            }

            draw() {
                const isNightMode = this.forceNight || this.env.isNight;
                this.ctx.fillStyle = isNightMode ? '#0a0a0a' : '#1a242f';
                this.ctx.fillRect(0, 0, this.width, this.height);

                const sandTop = this.floorY - this.sandLevel;
                const waterTop = sandTop - this.waterLevel;

                this.plants.forEach(p => p.draw(this.ctx));

                // Sand Layer
                this.ctx.fillStyle = '#C2A379';
                this.ctx.fillRect(0, sandTop, this.width, this.sandLevel + 100);

                // Water Layer
                if (this.waterLevel > 0) {
                    this.ctx.fillStyle = isNightMode ? 'rgba(30, 80, 140, 0.45)' : 'rgba(74, 144, 226, 0.4)';
                    this.ctx.fillRect(0, waterTop, this.width, this.waterLevel);
                    this.ctx.strokeStyle = isNightMode ? 'rgba(70, 130, 200, 0.7)' : 'rgba(74, 144, 226, 0.6)';
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, waterTop);
                    this.ctx.lineTo(this.width, waterTop);
                    this.ctx.stroke();
                }

                // Draw Rain
                this.raindrops.forEach(r => r.draw(this.ctx));

                // Draw Entities
                this.drops.forEach(d => d.draw(this.ctx));
                this.foods.forEach(f => f.draw(this.ctx));
                this.eggs.forEach(e => e.draw(this.ctx));
                this.organisms.forEach(o => o.draw(this.ctx));
                this.fish.forEach(f => f.draw(this.ctx));
                this.particles.forEach(p => p.draw(this.ctx));

                // Draw Visual Stimming Ripples
                this.ripples.forEach(rip => rip.draw(this.ctx));

                // Draw Magnet Reticle when active
                if (this.isPointerDown && this.activeTool === 'magnet') {
                    this.ctx.save();
                    this.ctx.strokeStyle = '#FF6B00';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.setLineDash([4, 4]);
                    this.ctx.beginPath();
                    this.ctx.arc(this.pointerX, this.pointerY, 40, 0, Math.PI * 2);
                    this.ctx.stroke();
                    this.ctx.restore();
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        class SensoryRipple {
            constructor(x, y, color = '#FF6B00', speed = 1) {
                this.x = x;
                this.y = y;
                this.radius = 2;
                this.maxRadius = 35 * speed;
                this.alpha = 1.0;
                this.color = color;
                this.active = true;
            }
            update(dt) {
                this.radius += 2.2 * dt;
                this.alpha -= 0.04 * dt;
                if (this.alpha <= 0 || this.radius >= this.maxRadius) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class RainDrop {
            constructor(x, y, wind) {
                this.x = x;
                this.y = y;
                this.vx = wind * 1.5;
                this.vy = 12 + Math.random() * 4;
                this.length = 10 + Math.random() * 5;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
            draw(ctx) {
                ctx.save();
                ctx.strokeStyle = 'rgba(160, 200, 255, 0.6)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 0.5, this.y + this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Drop {
            constructor(x, y, type) {
                this.x = x + (Math.random() - 0.5) * 20;
                this.y = y + (Math.random() - 0.5) * 20;
                this.vx = (Math.random() - 0.5);
                this.vy = Math.random() * 2 + 1;
                this.type = type;
            }
            update(dt) {
                this.vy += 0.3 * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
            draw(ctx) {
                ctx.fillStyle = this.type === 'sand' ? '#C2A379' : 'rgba(74, 144, 226, 0.8)';
                ctx.fillRect(this.x, this.y, 4, 4);
            }
        }

        class Food {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 10;
                this.y = y;
                this.vx = 0;
                this.vy = Math.random() * 1.5;
                this.size = 3 + Math.random() * 2;
                this.active = true;
            }
            applyMagnet(px, py, dt) {
                let dx = px - this.x;
                let dy = py - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5 && dist < 250) {
                    let force = (1 - dist / 250) * 8;
                    this.vx += (dx / dist) * force * dt;
                    this.vy += (dy / dist) * force * dt;
                }
            }
            update(sandTop, waterTop, hasWater, dt) {
                this.x += this.vx * dt;
                this.vx *= 0.92;

                const surfaceY = hasWater ? waterTop : sandTop;
                if (this.y < surfaceY - this.size) {
                    this.vy += 0.2 * dt; 
                    this.y += this.vy * dt;
                } else {
                    this.y = surfaceY - this.size;
                    this.vy = 0; 
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#D2B48C';
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        class ProceduralPlant {
            constructor(x, y, env) {
                this.x = x;
                this.y = y;
                this.env = env;
                this.touchBend = 0;
                this.mutate(env);
            }
            mutate(env) {
                this.segments = Math.floor(4 + Math.random() * 3);
                this.baseLength = 40 + (env.humidity * 0.3) + Math.random() * 20;
                this.angleVar = (Math.random() - 0.5) * 0.3;
                this.thickness = 3 + Math.random() * 2;
                this.nodeSwayOffset = Math.random() * 100;
                this.tipX = this.x;
                this.tipY = this.y - (this.segments * this.baseLength);
            }
            update(env, time, isDown, px, py, dt) {
                this.sway = Math.sin(time * 1.5 + this.nodeSwayOffset) * (env.wind * 0.8);
                
                // Tactile spring physics: touch interaction
                if (isDown) {
                    let dx = px - this.tipX;
                    let dy = py - this.tipY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 60) {
                        this.touchBend = (dx / 60) * 0.6; // bend towards cursor
                    }
                }
                this.touchBend *= Math.pow(0.85, dt); // snap-back oscillation
            }
            draw(ctx) {
                ctx.save();
                ctx.strokeStyle = '#4A7C59';
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'square'; 
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);

                let currX = this.x;
                let currY = this.y;

                for (let i = 0; i < this.segments; i++) {
                    const segmentFactor = (i + 1) / this.segments;
                    currX += Math.sin(this.angleVar * i + this.sway + this.touchBend) * (this.baseLength * 0.4);
                    currY -= this.baseLength * (1 - segmentFactor * 0.1);
                    if (i === this.segments - 1) { this.tipX = currX; this.tipY = currY; }
                    ctx.lineTo(currX, currY);
                }
                ctx.stroke();

                ctx.fillStyle = '#FF6B00';
                ctx.beginPath();
                ctx.arc(this.tipX, this.tipY, this.thickness + 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FishEgg {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.vy = 0;
                this.hatchTimer = 0;
                this.hatchTimeMax = 300 + Math.random() * 100;
                this.hatched = false;
            }
            update(sandTop, dt) {
                if (this.y < sandTop - this.radius) {
                    this.vy += 0.2 * dt;
                    this.y += this.vy * dt;
                } else {
                    this.y = sandTop - this.radius;
                    this.hatchTimer += dt;
                }
                if (this.hatchTimer >= this.hatchTimeMax) this.hatched = true;
            }
            draw(ctx) {
                ctx.fillStyle = '#E0E0E0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Fish {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = 10 + Math.random() * 6;
                this.tailWiggle = 0;
            }
            applyMagnet(px, py, dt) {
                let dx = px - this.x;
                let dy = py - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5 && dist < 220) {
                    let force = (1 - dist / 220) * 4;
                    this.vx += (dx / dist) * force * dt;
                    this.vy += (dy / dist) * force * dt;
                }
            }
            update(width, sandTop, waterTop, hasWater, foods, dt) {
                this.tailWiggle += 0.3 * dt;
                
                if (hasWater) {
                    let targetFood = null;
                    let minDist = 150;
                    for (let f of foods) {
                        if (f.active && f.y <= waterTop + 5) { 
                            let dx = f.x - this.x;
                            let dy = f.y - this.y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < minDist) { minDist = dist; targetFood = f; }
                        }
                    }

                    if (targetFood) {
                        let dx = targetFood.x - this.x;
                        let dy = targetFood.y - this.y;
                        let angle = Math.atan2(dy, dx);
                        this.vx = Math.cos(angle) * 2.5;
                        this.vy = Math.sin(angle) * 2.5;
                        if (minDist < 12) targetFood.active = false;
                    }

                    this.x += this.vx * dt;
                    this.y += (this.vy + Math.sin(this.tailWiggle * 0.5) * 0.2) * dt;
                    if (this.x < 20 || this.x > width - 20) this.vx *= -1;
                    if (this.y < waterTop + 10 || this.y > sandTop - 10) this.vy *= -1;
                } else {
                    this.vy += 0.3 * dt; 
                    this.y += this.vy * dt;
                    this.x += (this.vx * 0.2) * dt; 
                    
                    if (this.y > sandTop - this.size/2) {
                        this.y = sandTop - this.size/2;
                        if (Math.random() < 0.05 * dt) {
                            this.vy = -3 - Math.random() * 2;
                            this.vx = (Math.random() - 0.5) * 4;
                        }
                    }
                    if (this.x < 20 || this.x > width - 20) this.vx *= -1;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.vx < 0) ctx.scale(-1, 1);

                ctx.fillStyle = '#FF6B00'; 
                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size, -this.size/2);
                ctx.lineTo(-this.size, this.size/2);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                const tailOffset = Math.sin(this.tailWiggle) * 4;
                ctx.moveTo(-this.size, 0);
                ctx.lineTo(-this.size - 6, -4 + tailOffset);
                ctx.lineTo(-this.size - 6, 4 + tailOffset);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class CrawlingOrganism {
            constructor(x) {
                this.x = x;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.size = 3;
                this.y = 0;
            }
            applyMagnet(px, py, dt) {
                let dx = px - this.x;
                if (Math.abs(dx) < 200) {
                    this.vx += (dx > 0 ? 0.8 : -0.8) * dt;
                }
            }
            update(width, sandTop, foods, dt) {
                this.y = sandTop; 
                
                let targetFood = null;
                let minDist = 100;
                for (let f of foods) {
                    if (f.active && Math.abs((f.y + f.size) - sandTop) < 5) {
                        let dist = Math.abs(this.x - f.x);
                        if (dist < minDist) { minDist = dist; targetFood = f; }
                    }
                }

                if (targetFood) {
                    this.vx = targetFood.x > this.x ? 1.0 : -1.0;
                    if (minDist < 5) targetFood.active = false;
                } else {
                    if (Math.random() < 0.01 * dt) this.vx *= -1;
                }

                this.x += this.vx * dt;
                if (this.x < 10 || this.x > width - 10) this.vx *= -1;
            }
            draw(ctx) {
                ctx.fillStyle = '#888888';
                ctx.fillRect(this.x - this.size, this.y - this.size * 2, this.size * 2, this.size);
            }
        }

        class AmbientParticle {
            constructor(x, y, env, hasWater) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5 + (env.wind * 0.5);
                this.vy = hasWater ? -Math.random() * 1.2 - 0.2 : -Math.random() * 0.8 - 0.2;
                this.alpha = 1.0;
                this.size = 2;
            }
            applyMagnet(px, py, dt) {
                let dx = px - this.x;
                let dy = py - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5 && dist < 200) {
                    let force = (1 - dist / 200) * 3;
                    this.vx += (dx / dist) * force * dt;
                    this.vy += (dy / dist) * force * dt;
                }
            }
            update(env, hasWater, dt) {
                this.x += (this.vx + (env.wind * 0.2)) * dt;
                this.y += this.vy * dt;
                this.alpha -= 0.01 * dt;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#A0A0A0';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        const terrarium = new DigitalTerrarium();
        terrarium.loop();
    </script>
