<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terrarium Simulator - Orb.farm Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #07090e; color: #E0E0E0;
            overscroll-behavior-y: none;
        }

        #terrarium-canvas {
            display: block; width: 100vw; height: 100vh;
            touch-action: none; cursor: crosshair;
            image-rendering: pixelated;
        }

        .ui-panel {
            position: absolute; top: 16px; left: 16px;
            width: calc(100% - 32px); max-width: 320px;
            background-color: #12151d; border: 1px solid #232938;
            padding: 16px; pointer-events: auto; border-radius: 6px;
            max-height: calc(100vh - 32px); overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10;
        }

        h1 { font-size: 1.1rem; font-weight: 600; color: #FFFFFF; margin-bottom: 2px; }
        .subtitle { font-size: 0.72rem; color: #7a8296; margin-bottom: 12px; }

        .data-section {
            background-color: #181d28; padding: 10px; border-radius: 4px; margin-bottom: 12px;
        }
        .data-row {
            display: flex; justify-content: space-between; font-size: 0.72rem;
            line-height: 1.5; margin-bottom: 2px;
        }
        .data-row:last-child { margin-bottom: 0; }
        .data-label { color: #6b7280; }
        .data-value { color: #FFFFFF; font-family: ui-monospace, monospace; }

        .section-label {
            font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #6b7280; margin-bottom: 6px; margin-top: 10px; font-weight: 600;
        }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

        button {
            background-color: #1c2230; color: #D0D5E0; border: 1px solid #293245;
            padding: 7px 4px; font-size: 0.72rem; font-family: inherit;
            cursor: pointer; border-radius: 4px; transition: all 0.15s ease;
            user-select: none; -webkit-user-select: none; text-align: center;
        }
        button:active { background-color: #273044; }
        @media (hover: hover) {
            button:hover { background-color: #273044; border-color: #3e4c6a; color: #FFF; }
        }

        button.active-tool {
            background-color: #FF6B00; color: #000; border-color: #FF6B00; font-weight: 600;
        }
        button.speed-btn {
            background-color: #122434; border-color: #1b3a54; color: #64b5f6; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ui-panel" id="ui-panel">
        <h1>Orb Ecosystem</h1>
        <div class="subtitle">Cellular automata, gas cycles & living bio-grid.</div>
        
        <div class="data-section">
            <div class="data-row">
                <span class="data-label">Oxygen ($O_2$)</span>
                <span class="data-value" id="val-o2">100 ppm</span>
            </div>
            <div class="data-row">
                <span class="data-label">Carbon Dioxide ($CO_2$)</span>
                <span class="data-value" id="val-co2">40 ppm</span>
            </div>
            <div class="data-row">
                <span class="data-label">Climate / Cycle</span>
                <span class="data-value" id="val-climate">22°C / Day</span>
            </div>
        </div>

        <div class="section-label">Cellular Powder Tools</div>
        <div class="controls-grid">
            <button class="tool-btn active-tool" onclick="terrarium.setTool('sand')" id="tool-sand">⏳ Sand</button>
            <button class="tool-btn" onclick="terrarium.setTool('water')" id="tool-water">💧 Water</button>
            <button class="tool-btn" onclick="terrarium.setTool('stone')" id="tool-stone">🪨 Stone Barrier</button>
            <button class="tool-btn" onclick="terrarium.setTool('algae')" id="tool-algae">🌿 Algae</button>
            <button class="tool-btn" onclick="terrarium.setTool('food')" id="tool-food">🍞 Food Pellet</button>
            <button class="tool-btn" onclick="terrarium.setTool('erase')" id="tool-erase">🧹 Vacuum / Clear</button>
        </div>

        <div class="section-label">Fauna & Organisms</div>
        <div class="controls-grid">
            <button onclick="terrarium.spawnDaphnia()">🦐 Add Daphnia</button>
            <button onclick="terrarium.spawnFish()">🐟 Add Fish</button>
            <button onclick="terrarium.spawnSnail()">🐌 Add Snail</button>
            <button onclick="terrarium.spawnBug()">🐛 Add Bug</button>
        </div>

        <div class="section-label">Environment & Time</div>
        <div class="controls-grid">
            <button onclick="terrarium.toggleNight()" id="btn-night">🌙 Toggle Night</button>
            <button class="speed-btn" onclick="terrarium.toggleSpeed()" id="btn-speed">⏩ Speed: 1x</button>
            <button onclick="terrarium.resetEco()" style="grid-column: span 2;">🔄 Reset Orb</button>
        </div>
    </div>

    <canvas id="terrarium-canvas"></canvas>

    <script>
        // Cellular ID Enums
        const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, ALGAE = 4, WOOD = 5;

        class DigitalTerrarium {
            constructor() {
                this.canvas = document.getElementById('terrarium-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Simulation Grid Settings (Cellular automatas run on scaled buffer for 60fps)
                this.scale = 4; 
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 100));

                this.env = { temperature: 22, isNight: false, wind: 0.1 };
                this.forceNight = false;

                // Atmospheric Gas Reservoirs
                this.oxygen = 120;
                this.co2 = 45;

                // Micro-Organisms & Autonomous Agents
                this.fish = [];
                this.daphnia = [];
                this.snails = [];
                this.bugs = [];
                this.foods = [];
                this.gases = []; // Rising O2 & CO2 microscopic bubble particles

                this.time = 0;
                this.timeScale = 1;
                this.activeTool = 'sand';
                this.isPointerDown = false;
                this.pointerX = 0;
                this.pointerY = 0;

                this.setupInputs();
                this.initDefaultWorld();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                this.gw = Math.floor(this.width / this.scale);
                this.gh = Math.floor(this.height / this.scale);
                this.grid = new Uint8Array(this.gw * this.gh);
                this.gridNext = new Uint8Array(this.gw * this.gh);
            }

            setupInputs() {
                const getCoords = (e) => {
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
                    return {
                        gx: Math.floor(clientX / this.scale),
                        gy: Math.floor(clientY / this.scale)
                    };
                };

                this.canvas.addEventListener('pointerdown', (e) => {
                    if (e.target !== this.canvas) return;
                    this.isPointerDown = true;
                    const { gx, gy } = getCoords(e);
                    this.pointerX = gx; this.pointerY = gy;
                });

                this.canvas.addEventListener('pointermove', (e) => {
                    if (!this.isPointerDown) return;
                    const { gx, gy } = getCoords(e);
                    this.pointerX = gx; this.pointerY = gy;
                });

                window.addEventListener('pointerup', () => this.isPointerDown = false);
            }

            setTool(t) {
                this.activeTool = t;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
                const el = document.getElementById(`tool-${t}`);
                if (el) el.classList.add('active-tool');
            }

            toggleSpeed() {
                this.timeScale = this.timeScale === 1 ? 3 : (this.timeScale === 3 ? 8 : 1);
                document.getElementById('btn-speed').innerText = `⏩ Speed: ${this.timeScale}x`;
            }

            toggleNight() {
                this.forceNight = !this.forceNight;
                document.getElementById('val-climate').innerText = `22°C / ${(this.forceNight || this.env.isNight) ? 'Night' : 'Day'}`;
                document.getElementById('btn-night').innerText = this.forceNight ? "☀️ Reset Cycle" : "🌙 Force Night";
            }

            initDefaultWorld() {
                this.grid.fill(EMPTY);
                // Floor base
                for (let x = 0; x < this.gw; x++) {
                    for (let y = this.gh - 18; y < this.gh; y++) {
                        this.setCell(x, y, SAND);
                    }
                }
                // Water column
                for (let x = 0; x < this.gw; x++) {
                    for (let y = this.gh - 65; y < this.gh - 18; y++) {
                        this.setCell(x, y, WATER);
                    }
                }
                // Initial Algae Beds
                for (let x = 10; x < this.gw - 10; x += 3) {
                    this.setCell(x, this.gh - 19, ALGAE);
                }

                // Fauna
                this.fish = [new Fish(this.gw / 2, this.gh - 40)];
                this.daphnia = [new Daphnia(this.gw / 3, this.gh - 35), new Daphnia(this.gw * 0.7, this.gh - 30)];
                this.snails = [new Snail(this.gw / 4, this.gh - 18)];
                this.bugs = [new Bug(this.gw / 2, this.gh - 19)];
            }

            resetEco() {
                this.daphnia = []; this.fish = []; this.snails = []; this.bugs = [];
                this.foods = []; this.gases = [];
                this.initDefaultWorld();
            }

            getCell(x, y) {
                if (x < 0 || x >= this.gw || y < 0 || y >= this.gh) return STONE;
                return this.grid[y * this.gw + x];
            }

            setCell(x, y, val) {
                if (x >= 0 && x < this.gw && y >= 0 && y < this.gh) {
                    this.grid[y * this.gw + x] = val;
                }
            }

            applyPaintTool(dt) {
                if (!this.isPointerDown) return;
                const r = this.activeTool === 'stone' ? 3 : 2;
                for (let dy = -r; dy <= r; dy++) {
                    for (let dx = -r; dx <= r; dx++) {
                        const nx = this.pointerX + dx;
                        const ny = this.pointerY + dy;
                        if (this.activeTool === 'sand') this.setCell(nx, ny, SAND);
                        else if (this.activeTool === 'water') this.setCell(nx, ny, WATER);
                        else if (this.activeTool === 'stone') this.setCell(nx, ny, STONE);
                        else if (this.activeTool === 'algae') this.setCell(nx, ny, ALGAE);
                        else if (this.activeTool === 'erase') this.setCell(nx, ny, EMPTY);
                    }
                }
                if (this.activeTool === 'food' && Math.random() < 0.25 * dt) {
                    this.foods.push(new Food(this.pointerX, this.pointerY));
                }
            }

            // High-Speed Cellular Automata (Powder / Fluid Physics)
            updateGrid(dt) {
                this.gridNext.set(this.grid);

                // Bottom to top to ensure clean gravity falling
                for (let y = this.gh - 1; y >= 0; y--) {
                    for (let x = 0; x < this.gw; x++) {
                        const idx = y * this.gw + x;
                        const cell = this.grid[idx];

                        if (cell === SAND) {
                            const below = this.getCell(x, y + 1);
                            const bl = this.getCell(x - 1, y + 1);
                            const br = this.getCell(x + 1, y + 1);

                            if (below === EMPTY || below === WATER) {
                                this.gridNext[idx] = below;
                                this.gridNext[(y + 1) * this.gw + x] = SAND;
                            } else if (bl === EMPTY || bl === WATER) {
                                this.gridNext[idx] = bl;
                                this.gridNext[(y + 1) * this.gw + (x - 1)] = SAND;
                            } else if (br === EMPTY || br === WATER) {
                                this.gridNext[idx] = br;
                                this.gridNext[(y + 1) * this.gw + (x + 1)] = SAND;
                            }
                        } else if (cell === WATER) {
                            const below = this.getCell(x, y + 1);
                            if (below === EMPTY) {
                                this.gridNext[idx] = EMPTY;
                                this.gridNext[(y + 1) * this.gw + x] = WATER;
                            } else {
                                const dir = Math.random() < 0.5 ? 1 : -1;
                                const side1 = this.getCell(x + dir, y);
                                const side2 = this.getCell(x - dir, y);
                                const diag1 = this.getCell(x + dir, y + 1);
                                const diag2 = this.getCell(x - dir, y + 1);

                                if (diag1 === EMPTY) {
                                    this.gridNext[idx] = EMPTY;
                                    this.gridNext[(y + 1) * this.gw + (x + dir)] = WATER;
                                } else if (diag2 === EMPTY) {
                                    this.gridNext[idx] = EMPTY;
                                    this.gridNext[(y + 1) * this.gw + (x - dir)] = WATER;
                                } else if (side1 === EMPTY) {
                                    this.gridNext[idx] = EMPTY;
                                    this.gridNext[y * this.gw + (x + dir)] = WATER;
                                } else if (side2 === EMPTY) {
                                    this.gridNext[idx] = EMPTY;
                                    this.gridNext[y * this.gw + (x - dir)] = WATER;
                                }
                            }
                        } else if (cell === ALGAE) {
                            // Photosynthesis & Organic Growth Cycle
                            const isSunlit = !(this.forceNight || this.env.isNight);
                            if (isSunlit && this.co2 > 10 && Math.random() < 0.0008 * dt) {
                                // Grow to adjacent wet cell
                                const nx = x + (Math.random() < 0.5 ? 1 : -1);
                                const ny = y + (Math.random() < 0.5 ? 1 : -1);
                                if (this.getCell(nx, ny) === WATER) {
                                    this.gridNext[ny * this.gw + nx] = ALGAE;
                                    this.co2 -= 0.5;
                                    this.oxygen += 0.5;
                                    if (Math.random() < 0.2) this.gases.push(new GasBubble(x, y, 'O2'));
                                }
                            }
                        }
                    }
                }
                this.grid.set(this.gridNext);
            }

            spawnDaphnia() { this.daphnia.push(new Daphnia(this.gw / 2, this.gh / 2)); }
            spawnFish() { this.fish.push(new Fish(this.gw / 2, this.gh / 2)); }
            spawnSnail() { this.snails.push(new Snail(this.gw / 2, this.gh - 20)); }
            spawnBug() { this.bugs.push(new Bug(this.gw / 2, this.gh - 20)); }

            update() {
                const dt = this.timeScale;
                this.time += 0.016 * dt;

                this.applyPaintTool(dt);
                this.updateGrid(dt);

                // Update Gas Bubbles
                for (let i = this.gases.length - 1; i >= 0; i--) {
                    const g = this.gases[i];
                    g.update(this, dt);
                    if (!g.active) this.gases.splice(i, 1);
                }

                // Update Food Pellets
                for (let i = this.foods.length - 1; i >= 0; i--) {
                    const f = this.foods[i];
                    f.update(this, dt);
                    if (!f.active) this.foods.splice(i, 1);
                }

                // Update Ecosystem Agents
                this.daphnia.forEach((d, i) => d.update(this, dt, i));
                this.snails.forEach(s => s.update(this, dt));
                this.fish.forEach((f, i) => f.update(this, dt, i));
                this.bugs.forEach(b => b.update(this, dt));

                // Clean Dead Agents
                this.daphnia = this.daphnia.filter(d => d.alive);
                this.fish = this.fish.filter(f => f.alive);

                // HUD Stats Sync
                document.getElementById('val-o2').innerText = `${Math.floor(this.oxygen)} ppm`;
                document.getElementById('val-co2').innerText = `${Math.floor(this.co2)} ppm`;
            }

            draw() {
                const isNight = this.forceNight || this.env.isNight;
                this.ctx.fillStyle = isNight ? '#05070a' : '#0e141f';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Render Cellular Powder Canvas
                const imgData = this.ctx.createImageData(this.gw, this.gh);
                const data = imgData.data;

                for (let i = 0; i < this.gw * this.gh; i++) {
                    const cell = this.grid[i];
                    const idx = i * 4;
                    if (cell === SAND) {
                        data[idx] = 194; data[idx+1] = 163; data[idx+2] = 121; data[idx+3] = 255;
                    } else if (cell === WATER) {
                        data[idx] = 56; data[idx+1] = 132; data[idx+2] = 210; data[idx+3] = isNight ? 120 : 160;
                    } else if (cell === STONE) {
                        data[idx] = 75; data[idx+1] = 82; data[idx+2] = 95; data[idx+3] = 255;
                    } else if (cell === ALGAE) {
                        data[idx] = 76; data[idx+1] = 160; data[idx+2] = 88; data[idx+3] = 255;
                    }
                }

                // Draw Powder Layer Up-Scaled
                createImageBitmap(imgData).then(bmp => {
                    this.ctx.drawImage(bmp, 0, 0, this.width, this.height);
                });

                // Render High-Resolution Living Fauna
                this.ctx.save();
                this.ctx.scale(this.scale, this.scale);

                this.gases.forEach(g => g.draw(this.ctx));
                this.foods.forEach(f => f.draw(this.ctx));
                this.daphnia.forEach(d => d.draw(this.ctx));
                this.snails.forEach(s => s.draw(this.ctx));
                this.bugs.forEach(b => b.draw(this.ctx));
                this.fish.forEach(f => f.draw(this.ctx));

                this.ctx.restore();
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        // Rising Oxygen & Carbon Dioxide Bubbles
        class GasBubble {
            constructor(x, y, type) {
                this.x = x; this.y = y;
                this.type = type;
                this.active = true;
            }
            update(sim, dt) {
                this.y -= 0.6 * dt;
                this.x += (Math.random() - 0.5) * 0.4;
                const cell = sim.getCell(Math.floor(this.x), Math.floor(this.y));
                if (cell === EMPTY || this.y < 0) {
                    this.active = false; // Emitted into open atmosphere
                }
            }
            draw(ctx) {
                ctx.fillStyle = this.type === 'O2' ? 'rgba(255, 255, 255, 0.7)' : 'rgba(160, 200, 255, 0.5)';
                ctx.fillRect(this.x, this.y, 1.2, 1.2);
            }
        }

        class Food {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.active = true;
            }
            update(sim, dt) {
                const cellBelow = sim.getCell(Math.floor(this.x), Math.floor(this.y + 1));
                if (cellBelow === EMPTY) this.y += 0.5 * dt;
                else if (cellBelow === WATER) this.y += 0.15 * dt; // Slow sinking in water
            }
            draw(ctx) {
                ctx.fillStyle = '#FF9800';
                ctx.fillRect(this.x, this.y, 1.8, 1.8);
            }
        }

        // Daphnia (Water Fleas) - Filter Feeders
        class Daphnia {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = 0; this.vy = 0;
                this.alive = true;
            }
            update(sim, dt) {
                if (Math.random() < 0.08 * dt) {
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.6) * 1.5; // Upward darting
                }
                this.vx *= 0.85; this.vy *= 0.85;
                this.x += this.vx * dt; this.y += this.vy * dt;

                // Eat Algae Nearby
                const gx = Math.floor(this.x), gy = Math.floor(this.y);
                if (sim.getCell(gx, gy) === ALGAE) {
                    sim.setCell(gx, gy, WATER);
                    sim.co2 += 0.3;
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#ff7043';
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        // Fish - Apex Predator of the Orb
        class Fish {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = 0.6; this.vy = 0;
                this.alive = true;
            }
            update(sim, dt) {
                // Hunt Daphnia or Food
                let target = null;
                let minDist = 35;
                sim.daphnia.forEach(d => {
                    const dist = Math.hypot(d.x - this.x, d.y - this.y);
                    if (dist < minDist) { minDist = dist; target = d; }
                });

                if (target) {
                    const a = Math.atan2(target.y - this.y, target.x - this.x);
                    this.vx += Math.cos(a) * 0.12 * dt;
                    this.vy += Math.sin(a) * 0.12 * dt;
                    if (minDist < 3) {
                        target.alive = false; // Eat Daphnia
                        sim.co2 += 1.2;
                        sim.gases.push(new GasBubble(this.x, this.y, 'CO2'));
                    }
                } else {
                    this.vx += (Math.random() - 0.5) * 0.08;
                    this.vy += (Math.random() - 0.5) * 0.08;
                }

                this.vx = Math.max(-1.2, Math.min(1.2, this.vx));
                this.vy = Math.max(-0.6, Math.min(0.6, this.vy));
                this.x += this.vx * dt; this.y += this.vy * dt;

                // Avoid solid boundaries
                if (sim.getCell(Math.floor(this.x + this.vx * 3), Math.floor(this.y)) !== WATER) this.vx *= -1;
                if (sim.getCell(Math.floor(this.x), Math.floor(this.y + this.vy * 3)) !== WATER) this.vy *= -1;
            }
            draw(ctx) {
                ctx.fillStyle = '#FF6B00';
                ctx.fillRect(this.x - 2, this.y - 1, 5, 2.5);
                ctx.fillRect(this.x - 3, this.y - (this.vx > 0 ? 0 : 0.5), 1.5, 1.5);
            }
        }

        // Snail - Tank Wall & Floor Algae Scraper
        class Snail {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = 0.15;
            }
            update(sim, dt) {
                const gx = Math.floor(this.x + this.vx);
                const gy = Math.floor(this.y);
                const below = sim.getCell(gx, gy + 1);

                if (below === SAND || below === STONE) {
                    this.x += this.vx * dt;
                    // Scrape Algae
                    if (sim.getCell(gx, gy) === ALGAE) {
                        sim.setCell(gx, gy, EMPTY);
                        sim.co2 += 0.4;
                    }
                } else {
                    this.vx *= -1;
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(this.x, this.y, 3, 2);
            }
        }

        // Bug - Terrestrial Scavenger
        class Bug {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = 0.4;
            }
            update(sim, dt) {
                const gx = Math.floor(this.x + this.vx);
                const gy = Math.floor(this.y);
                const below = sim.getCell(gx, gy + 1);
                if (below === SAND || below === STONE) {
                    this.x += this.vx * dt;
                } else {
                    this.vx *= -1;
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#78909c';
                ctx.fillRect(this.x, this.y, 2, 1.5);
            }
        }

        const terrarium = new DigitalTerrarium();
        terrarium.loop();
    </script>
</body>
</html>
